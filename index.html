        // Подсветка целой конфигурации (3-4 тела) на колесе — все аспект-линии
        // между её участниками и сами планеты, остальное бледнеет (как у таблицы
        // аспектов). Снятие подсветки — тот же unhighlightWheelAspect.
        window.highlightWheelConfiguration = function(memberIds) {
            const svg = document.querySelector('#canvasContainer svg');
            if (!svg) return;
            for (let i = 0; i < memberIds.length; i++) {
                for (let j = i + 1; j < memberIds.length; j++) {
                    document.querySelectorAll('[data-a][data-b]').forEach(el => {
                        const a = el.getAttribute('data-a'), b = el.getAttribute('data-b');
                        if ((a === memberIds[i] && b === memberIds[j]) || (a === memberIds[j] && b === memberIds[i])) {

                if (memberIds.includes(pb.getAttribute('data-id'))) pb.classList.add('planet-focus');

        };

        window.calculateChart = async function(event) {
            event.preventDefault();
            if (selectedLocation.lat === null) {
                document.getElementById('infoPanel').innerText = "Укажите место рождения — выберите город из списка подсказок или введите координаты вручную.";
                return;
            }

            const timezoneValue = document.getElementById('timezone').value;
            const payload = {
                name: document.getElementById('name').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                lat: selectedLocation.lat,
                lon: selectedLocation.lon,
                gender: document.getElementById('gender').value
            };
            if (timezoneValue !== '') {
                payload.timezone = timezoneValue;
            }

            try {
                document.getElementById('infoPanel').innerText = "Анализ данных и расчет орбитальных позиций...";
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.status === "success") {
                    window.lastChartData = data;
                    window.drawZodiacChart(data);
                    window.updateChartTopBar();
                    document.getElementById('formModal').style.display = 'none';
                    document.getElementById('infoPanel').innerHTML = "Карта успешно построена.<br><span style='color:var(--accent); font-size:0.9rem;'>Кликая на планеты, можно изучать их бизнес-трактовку.</span>";

                    // Сохраняем карту в библиотеку — тихо, ошибка сохранения не должна мешать
                    // уже построенной карте на экране
                    try {
                        await fetch('/api/charts', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: payload.name,
                                date: payload.date,
                                time: payload.time,
                                lat: payload.lat,
                                lon: payload.lon,
                                place_name: selectedLocation.name,
                                timezone: document.getElementById('timezone').value,
                                gender: payload.gender
                            })
                        });
                    } catch (saveErr) {
                        console.error("Не удалось сохранить карту в библиотеку:", saveErr);
                    }
                } else {
                    document.getElementById('infoPanel').innerText = "Ошибка: " + data.message;
                }
            } catch (err) {
                document.getElementById('infoPanel').innerHTML = "<span style='color:#e74c3c;'>Не удалось связаться с сервером.</span>";
            }
        };

        window.drawZodiacChart = function(data) {
            const size = 800;
            const center = size / 2;
            const radius = 340;
            const innerRadius = radius - 110;

            let svgContent = `<svg viewBox="0 0 ${size} ${size}">`;

            const ascObj = data.houses.find(h => h.num === 1);
            const ascLong = ascObj ? ascObj.longitude : 0;
            
            // Отсчет слева направо (Против часовой стрелки от Асцендента)
            function getScreenAngle(longitude) {
                return 180 - (longitude - ascLong);
            }

            // Углы планет считаем заранее (а не только в секции 4), чтобы куспиды домов
            // (секция 3) знали, где физически проходит разрыв под символом планеты
            const baseRadius = radius - 75;
            let planets = JSON.parse(JSON.stringify(data.planets || []));
            planets.sort((a, b) => b.longitude - a.longitude);
            const angleStep = 10; // градусов смещения символа на каждую коллизию

            // Группируем подряд идущие (по долготе) близкие планеты в кластеры-стеллиумы
            planets.forEach(p => { p.trueAngle = getScreenAngle(p.longitude); });
            const clusters = [];
            let currentCluster = [];
            planets.forEach((p, idx) => {
                if (idx === 0) { currentCluster = [p]; return; }
                let diff = Math.abs(p.longitude - planets[idx - 1].longitude);
                if (diff > 180) diff = 360 - diff;
                if (diff < 5.5) { currentCluster.push(p); }
                else { clusters.push(currentCluster); currentCluster = [p]; }
            });
            if (currentCluster.length) clusters.push(currentCluster);

            clusters.forEach(cluster => {
                const n = cluster.length;
                if (n === 1) { cluster[0].displayAngle = cluster[0].trueAngle; return; }
                // Симметричный веер вокруг истинного центра скопления. Сдвиг на +0.3 шага
                // не даёт офсету обнулиться ни у одного члена (иначе, как в стеллиуме из 3,
                // средняя по счёту планета оставалась бы точно на истинном месте и теряла
                // волнистую линию-поводок) — при этом порядок вдоль круга не меняется.
                const centerAngle = cluster[Math.floor((n - 1) / 2)].trueAngle;
                cluster.forEach((p, i) => {
                    p.displayAngle = centerAngle + (i - (n - 1) / 2 + 0.3) * angleStep;
                });
            });

            svgContent += `<circle cx="${center}" cy="${center}" r="${radius}" stroke="none" fill="var(--canvas-bg)" />`;

            // Дуги соединений рисуются ещё раз поверх всего в конце (см. низ функции) —
            // иначе их перекрывает линия внутреннего круга и другие элементы, рисуемые позже
            let conjunctionOverlay = '';

            // 1. АСПЕКТЫ — только к 10 настоящим планетам, фиктивные точки
            // (Хирон, Лилит, Северный/Южный Узел) в видимых аспектах не участвуют.
            // Орбис для каждой пары — по таблице (getPairOrb), одинаковый для всех
            // типов аспектов внутри пары.
            const aspectPlanets = (data.planets || []).filter(p => !FICTITIOUS_POINTS.includes(p.id));

            const pairAspects = {};
            if (aspectPlanets.length > 1) {
                for (let i = 0; i < aspectPlanets.length; i++) {
                    for (let j = i + 1; j < aspectPlanets.length; j++) {
                        const p1 = aspectPlanets[i], p2 = aspectPlanets[j];
                        if (typeof p1.longitude !== 'number' || typeof p2.longitude !== 'number') continue;
                        const orb = getPairOrb(p1.id, p2.id);
                        const asp = detectAspect(p1.longitude, p2.longitude, orb);
                        if (asp) pairAspects[`${i},${j}`] = asp;
                    }
                }
            }

            if (aspectPlanets.length > 1) {
                for (let i = 0; i < aspectPlanets.length; i++) {
                    for (let j = i + 1; j < aspectPlanets.length; j++) {
                        const aspect = pairAspects[`${i},${j}`];
                        if (!aspect) continue;
                        if (WHEEL_HIDDEN_MINOR_ASPECTS.includes(aspect.name)) continue;

                        const p1 = aspectPlanets[i];
                        const p2 = aspectPlanets[j];

                        // Координаты на внутреннем круге (до точки планеты)
                        const a1x = center + innerRadius * dCos(getScreenAngle(p1.longitude));
                        const a1y = center + innerRadius * dSin(getScreenAngle(p1.longitude));
                        const a2x = center + innerRadius * dCos(getScreenAngle(p2.longitude));
                        const a2y = center + innerRadius * dSin(getScreenAngle(p2.longitude));

                        const midX = (a1x + a2x) / 2;
                        const midY = (a1y + a2y) / 2;

                        const strokeWidth = aspect.name === 'Соединение' ? 3.5 : (aspect.type === 'major' ? 1.5 : 1);
                        const opacity = aspect.name === 'Соединение' ? 1 : (aspect.exact ? 0.9 : 0.65);
                        const dash = aspect.type === 'minor' ? '4,4' : '';

                        const tooltipText = `${aspect.angle}° ${p1.name} ↔ ${p2.name} ${toDMS(aspect.diff)} (${toDMS(aspect.delta)})`;

                        const isConjunction = aspect.name === 'Соединение';
                        const isOpposition = aspect.name === 'Оппозиция';
                        // Соединение — планеты рядом, линия идёт дугой строго по контуру внутреннего круга
                        // (та же радиус, что у планет), чтобы точно соединять их позиции
                        const angle1 = getScreenAngle(p1.longitude);
                        const angle2 = getScreenAngle(p2.longitude);
                        const arcSweep = angle2 < angle1 ? 0 : 1;
                        const conjArcPath = `M ${a1x} ${a1y} A ${innerRadius} ${innerRadius} 0 0 ${arcSweep} ${a2x} ${a2y}`;
                        // Для соединения тут рисуем только НЕВИДИМУЮ область для hover-тултипа —
                        // видимая линия только одна, в conjunctionOverlay (иначе двойная обводка даёт волнистый край)
                        const linkShape = isConjunction
                            ? `<path d="${conjArcPath}" fill="none" stroke="transparent" stroke-width="${strokeWidth + 6}" />`
                            : `<line x1="${a1x}" y1="${a1y}" x2="${a2x}" y2="${a2y}"
                                      stroke="${aspect.color}"
                                      stroke-width="${strokeWidth}"
                                      stroke-opacity="${opacity}"
                                      stroke-dasharray="${dash}" />`;

                        if (isConjunction) {
                            // Копия дуги добавляется поверх всех остальных элементов в конце,
                            // чтобы линия круга (рисуется позже) её не перекрывала и не "размазывала"
                            conjunctionOverlay += `<path data-a="${p1.id}" data-b="${p2.id}" d="${conjArcPath}" fill="none" stroke="${aspect.color}" stroke-width="${strokeWidth}" stroke-linecap="round" pointer-events="none" />`;
                        }

                        svgContent += `
                            <g class="aspect-link" data-a="${p1.id}" data-b="${p2.id}" style="cursor:help;">
                                <title>${tooltipText}</title>
                                ${linkShape}
                                ${(isConjunction || isOpposition) ? '' : `<circle cx="${midX}" cy="${midY}" r="7" fill="var(--canvas-bg)" />
                                <text x="${midX}" y="${midY}" fill="${aspect.color}" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central">${aspect.symbol}</text>`}
                            </g>
                        `;
                    }
                }
            }

            // Дополнительно: аспекты к фиктивным точкам (Хирон/Лилит/оба Узла) —
            // СКРЫТЫЕ по умолчанию (той же логикой, что и в таблице аспектов).
            // Они не видны на круге, пока пользователь не наведёт курсор на
            // соответствующую ячейку в таблице — тогда режим фокуса их проявит.
            // Видимый набор аспектов выше от этого прохода никак не меняется.
            {
                const { bodies: allAspBodies, pairs: allAspPairs } = computeAspectPairs(data.planets || []);
                allAspPairs.forEach(({ i, j, aspect }) => {
                    const p1 = allAspBodies[i], p2 = allAspBodies[j];
                    const bothReal = !FICTITIOUS_POINTS.includes(p1.id) && !FICTITIOUS_POINTS.includes(p2.id);
                    if (bothReal) return; // уже нарисован выше как видимый

                    const hx1 = center + innerRadius * dCos(getScreenAngle(p1.longitude));
                    const hy1 = center + innerRadius * dSin(getScreenAngle(p1.longitude));
                    const hx2 = center + innerRadius * dCos(getScreenAngle(p2.longitude));
                    const hy2 = center + innerRadius * dSin(getScreenAngle(p2.longitude));
                    const hTooltip = `${aspect.angle}° ${p1.name} ↔ ${p2.name} ${toDMS(aspect.diff)} (${toDMS(aspect.delta)})`;

                    svgContent += `
                        <g class="aspect-link aspect-hidden" data-a="${p1.id}" data-b="${p2.id}">
                            <title>${hTooltip}</title>
                            <line x1="${hx1}" y1="${hy1}" x2="${hx2}" y2="${hy2}" stroke="${aspect.color}" stroke-width="${aspect.type === 'major' ? 1.5 : 1}" stroke-dasharray="${aspect.type === 'minor' ? '4,4' : ''}" />
                        </g>`;
                });
            }

            // Дополнительно: аспекты осей домов (нижние строки таблицы аспектов) к
            // планетам — тоже только СКРЫТЫЕ крючки для подсветки, на круге их не
            // видно никогда (в отличие от фиктивных точек выше, которые хотя бы
            // могут в теории быть частью видимого набора)
            {
                const houseAxisBodies = HOUSE_AXIS_NUMS.map(num => {
                    const h = (data.houses || []).find(hh => hh.num === num);
                    return h ? { id: `house${num}`, name: `Дом ${num}`, longitude: h.longitude, isAxis: true } : null;
                }).filter(Boolean);
                const combined = [...(data.planets || []), ...houseAxisBodies];
                const { bodies: hxBodies, pairs: hxPairs } = computeAspectPairs(combined);
                hxPairs.forEach(({ i, j, aspect }) => {
                    const b1 = hxBodies[i], b2 = hxBodies[j];
                    if (!!b1.isAxis === !!b2.isAxis) return; // нужна ровно одна ось дома в паре

                    const hx1 = center + innerRadius * dCos(getScreenAngle(b1.longitude));
                    const hy1 = center + innerRadius * dSin(getScreenAngle(b1.longitude));
                    const hx2 = center + innerRadius * dCos(getScreenAngle(b2.longitude));
                    const hy2 = center + innerRadius * dSin(getScreenAngle(b2.longitude));
                    const hTooltip = `${aspect.angle}° ${b1.name} ↔ ${b2.name} ${toDMS(aspect.diff)} (${toDMS(aspect.delta)})`;

                    svgContent += `
                        <g class="aspect-link aspect-hidden" data-a="${b1.id}" data-b="${b2.id}">
                            <title>${hTooltip}</title>
                            <line x1="${hx1}" y1="${hy1}" x2="${hx2}" y2="${hy2}" stroke="${aspect.color}" stroke-width="${aspect.type === 'major' ? 1.5 : 1}" stroke-dasharray="${aspect.type === 'minor' ? '4,4' : ''}" />
                        </g>`;
                });
            }

            // 3. ДОМА
            if (data.houses) {
                data.houses.forEach(house => {
                    const angle = getScreenAngle(house.longitude);
                    const isMainAxis = (house.num === 1 || house.num === 10 || house.num === 4 || house.num === 7);
                    
                    const strokeColor = isMainAxis ? "var(--accent)" : "var(--house-line-main)";
                    const strokeWidth = isMainAxis ? "2" : "1";

                    // Удлиняем куспиды
                    const extendOut = radius + 22;
                    const circleR = 4.5;
                    // У MC линия не должна заходить в кружок-терминатор — укорачиваем её на радиус кружка
                    const lineOuterExtent = house.num === 10 ? extendOut - circleR : extendOut;
                    const x1 = center + lineOuterExtent * dCos(angle);
                    const y1 = center + lineOuterExtent * dSin(angle);
                    const x2 = center + innerRadius * dCos(angle);
                    const y2 = center + innerRadius * dSin(angle);

                    // Линия куспида физически прерывается в зоне кольца знаков (radius-45..radius),
                    // а не просто перекрывается им — иначе просвечивала бы сквозь полупрозрачную заливку
                    const ogx = center + radius * dCos(angle);
                    const ogy = center + radius * dSin(angle);
                    const igx = center + (radius - 45) * dCos(angle);
                    const igy = center + (radius - 45) * dSin(angle);

                    svgContent += `<g class="house-cusp" data-house="${house.num}">`;
                    svgContent += `<line x1="${x1}" y1="${y1}" x2="${ogx}" y2="${ogy}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;

                    // Если под этим куспидом сидит символ планеты (на baseRadius) — физически
                    // прерываем линию вокруг него, чтобы "палочка" не торчала под планетой
                    const planetHere = planets.some(p => {
                        let diff = Math.abs(p.displayAngle - angle) % 360;
                        if (diff > 180) diff = 360 - diff;
                        return diff < 4;
                    });
                    if (planetHere) {
                        const gapHalf = 16;
                        const gx1 = center + (baseRadius + gapHalf) * dCos(angle);
                        const gy1 = center + (baseRadius + gapHalf) * dSin(angle);
                        const gx2 = center + (baseRadius - gapHalf) * dCos(angle);
                        const gy2 = center + (baseRadius - gapHalf) * dSin(angle);
                        svgContent += `<line x1="${igx}" y1="${igy}" x2="${gx1}" y2="${gy1}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                        svgContent += `<line x1="${gx2}" y1="${gy2}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                    } else {
                        svgContent += `<line x1="${igx}" y1="${igy}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                    }

                    // Терминаторы угловых куспидов: стрелка только на ASC, кружок только на MC (на конце палочки)
                    if (house.num === 1) {
                        const tipX = center + extendOut * dCos(angle);
                        const tipY = center + extendOut * dSin(angle);
                        const arrowLen = 10, arrowWidth = 6;
                        const bx = center + (extendOut - arrowLen) * dCos(angle);
                        const by = center + (extendOut - arrowLen) * dSin(angle);
                        const perpAngle = angle + 90;
                        const p1x = bx + arrowWidth * dCos(perpAngle), p1y = by + arrowWidth * dSin(perpAngle);
                        const p2x = bx - arrowWidth * dCos(perpAngle), p2y = by - arrowWidth * dSin(perpAngle);
                        svgContent += `<polygon points="${tipX},${tipY} ${p1x},${p1y} ${p2x},${p2y}" fill="var(--accent)" />`;
                    } else if (house.num === 10) {
                        const tipX = center + extendOut * dCos(angle);
                        const tipY = center + extendOut * dSin(angle);
                        svgContent += `<circle cx="${tipX}" cy="${tipY}" r="${circleR}" fill="none" stroke="var(--accent)" stroke-width="2" />`;
                    }

                    // Подписи домов на внешнем радиусе
                    const tx = center + (extendOut + 15) * dCos(angle);
                    const ty = center + (extendOut + 15) * dSin(angle);

                    let houseLabel = ROMAN_NUMERALS[house.num];
                    if (house.num === 1) houseLabel = "ASC";
                    else if (house.num === 4) houseLabel = "IC";
                    else if (house.num === 7) houseLabel = "DSC";
                    else if (house.num === 10) houseLabel = "MC";

                    const labelColor = isMainAxis ? "var(--accent)" : "var(--text-muted)";
                    const labelWeight = isMainAxis ? "bold" : "normal";

                    svgContent += `<text x="${tx}" y="${ty}" fill="${labelColor}" font-size="14" font-weight="${labelWeight}" text-anchor="middle" dominant-baseline="central">${houseLabel}</text>`;

                    // Градус дома в верхнем правом углу от названия
                    const houseDegree = Math.ceil(house.longitude % 30) === 0 ? 1 : Math.ceil(house.longitude % 30);
                    const houseDegreeColor = isMainAxis ? "var(--accent)" : "var(--text-main)";
                    svgContent += `<text x="${tx + 7}" y="${ty - 7}" fill="${houseDegreeColor}" font-size="9" font-weight="bold" text-anchor="start">${houseDegree}°</text>`;
                    svgContent += `</g>`;
                });
            }

            // 2. ВНЕШНЕЕ КОЛЬЦО (Цвета стихий и квадратики символов)
            // Рисуется ПОСЛЕ домов, чтобы кольцо перекрывало палки куспидов в месте пересечения
            const ringOuter = radius;
            const ringInner = radius - 45;
            for (let i = 0; i < 12; i++) {
                const angleStart = getScreenAngle(i * 30);
                const angleEnd = getScreenAngle((i + 1) * 30);
                const style = ELEMENT_STYLES[i];

                // Закрашенный кольцевой сектор — точные границы, без "гуляющих" краёв
                const oStartX = center + ringOuter * dCos(angleStart);
                const oStartY = center + ringOuter * dSin(angleStart);
                const oEndX = center + ringOuter * dCos(angleEnd);
                const oEndY = center + ringOuter * dSin(angleEnd);
                const iEndX = center + ringInner * dCos(angleEnd);
                const iEndY = center + ringInner * dSin(angleEnd);
                const iStartX = center + ringInner * dCos(angleStart);
                const iStartY = center + ringInner * dSin(angleStart);

                svgContent += `<path d="M ${oStartX} ${oStartY} A ${ringOuter} ${ringOuter} 0 0 0 ${oEndX} ${oEndY} L ${iEndX} ${iEndY} A ${ringInner} ${ringInner} 0 0 1 ${iStartX} ${iStartY} Z" fill="${style.bg}" stroke="none" />`;

                const lx1 = center + radius * dCos(angleStart);
                const ly1 = center + radius * dSin(angleStart);
                const lx2 = center + (radius - 45) * dCos(angleStart);
                const ly2 = center + (radius - 45) * dSin(angleStart);
                svgContent += `<line x1="${lx1}" y1="${ly1}" x2="${lx2}" y2="${ly2}" stroke="var(--circle-base)" stroke-width="1.2" />`;

                // Символ знака зодиака прямо на закрашенной дуге
                const midAngle = getScreenAngle(i * 30 + 15);
                const sx = center + (radius - 22.5) * dCos(midAngle);
                const sy = center + (radius - 22.5) * dSin(midAngle);

                svgContent += `<text x="${sx}" y="${sy}" fill="var(--text-main)" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">${ZODIAC_SYMBOLS[i]}</text>`;
            }

            svgContent += `<circle cx="${center}" cy="${center}" r="${radius - 45}" stroke="var(--circle-accent)" stroke-width="1.2" fill="none" />`;
            svgContent += `<circle cx="${center}" cy="${center}" r="${innerRadius}" stroke="var(--circle-base)" stroke-width="1.5" fill="none" />`;

            // Деления-риски по кольцу знаков (каждые 5°, крупнее на каждые 10°)
            for (let deg = 0; deg < 360; deg += 5) {
                const tickAngle = getScreenAngle(deg);
                const isMajorTick = deg % 10 === 0;
                const tickLen = isMajorTick ? 10 : 5;
                const tx1 = center + radius * dCos(tickAngle);
                const ty1 = center + radius * dSin(tickAngle);
                const tx2 = center + (radius - tickLen) * dCos(tickAngle);
                const ty2 = center + (radius - tickLen) * dSin(tickAngle);
                svgContent += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="var(--tick-color)" stroke-width="1" />`;
            }

            // 4. ПЛАНЕТЫ (С анти-коллизией)
            // При скоплении планеты НЕ уходят по радиусу, а сдвигаются ПО УГЛУ,
            // оставаясь на одном радиусе — как бусины на нитке, повторяя линию круга.
            // (сам расчёт trueAngle/displayAngle сделан раньше, см. начало функции —
            // он нужен уже секции 3, чтобы прерывать куспид под символом планеты)
            planets.forEach(body => {
                const trueAngle = body.trueAngle;
                const symbolAngle = body.displayAngle;

                const dotX = center + innerRadius * dCos(trueAngle);
                const dotY = center + innerRadius * dSin(trueAngle);
                svgContent += `<circle cx="${dotX}" cy="${dotY}" r="3.5" fill="var(--accent)" />`;

                if (Math.abs(symbolAngle - trueAngle) > 0.01) {
                    const lineX = center + (baseRadius - 16) * dCos(symbolAngle);
                    const lineY = center + (baseRadius - 16) * dSin(symbolAngle);
                    const leaderPath = wavyLinePath(dotX, dotY, lineX, lineY, 1.5, 3);
                    svgContent += `<path d="${leaderPath}" fill="none" stroke="#e74c3c" stroke-width="0.9" stroke-opacity="0.45" />`;
                }

                const px = center + baseRadius * dCos(symbolAngle);
                const py = center + baseRadius * dSin(symbolAngle);

                const roundedDegree = Math.ceil(body.longitude % 30) === 0 ? 1 : Math.ceil(body.longitude % 30);
                const safeInterp = body.interpretation ? body.interpretation.replace(/'/g, "\\'").replace(/\n/g, " ") : "";

                const symbolMarkup = body.id === 'Pluto'
                    ? `<g transform="translate(${px} ${py - 4})" style="color: var(--planet-color);" onmouseover="this.style.color='#c9a054'" onmouseout="this.style.color='var(--planet-color)'">
                        <circle cx="0" cy="-11" r="4.8" fill="none" stroke="currentColor" stroke-width="2.2" />
                        <path d="M -7 -8 A 7 7 0 0 0 7 -8" fill="none" stroke="currentColor" stroke-width="2.2" />
                        <line x1="0" y1="-1" x2="0" y2="8.3" stroke="currentColor" stroke-width="2.2" />
                        <line x1="-5.5" y1="3.2" x2="5.5" y2="3.2" stroke="currentColor" stroke-width="2.2" />
                      </g>`
                    : (() => {
                        // У Марса и Венеры глиф в системных шрифтах визуально тоньше остальных
                        // планет даже при том же font-weight — усиливаем обводкой того же цвета
                        const needsBoldStroke = body.id === 'Mars' || body.id === 'Venus';
                        const strokeAttr = needsBoldStroke ? ` stroke="var(--planet-color)" stroke-width="1.3"` : '';
                        const hoverIn = needsBoldStroke
                            ? `this.setAttribute('fill', '#c9a054'); this.setAttribute('stroke', '#c9a054')`
                            : `this.setAttribute('fill', '#c9a054')`;
                        const hoverOut = needsBoldStroke
                            ? `this.setAttribute('fill', 'var(--planet-color)'); this.setAttribute('stroke', 'var(--planet-color)')`
                            : `this.setAttribute('fill', 'var(--planet-color)')`;
                        return `<text x="${px}" y="${py - 4}" fill="var(--planet-color)"${strokeAttr} font-size="24" font-weight="900" text-anchor="middle" dominant-baseline="central" onmouseover="${hoverIn}" onmouseout="${hoverOut}">${body.symbol}</text>`;
                    })();

                svgContent += `<g class="planet-body" data-id="${body.id}" onclick="window.showElementInfo('${body.name}', ${body.longitude}, '${safeInterp}')" style="cursor:pointer;">
                    ${symbolMarkup}
                    <text x="${px + 11}" y="${py - 10}" fill="var(--text-main)" font-size="9.5" font-family="monospace" font-weight="bold" text-anchor="start">
                        ${roundedDegree}°
                    </text>${body.retrograde ? `
                    <text x="${px + 11}" y="${py + 13}" fill="var(--text-main)" font-size="8" font-weight="bold" text-anchor="start">r</text>` : ''}
                </g>`;
            });

            svgContent += conjunctionOverlay;
            svgContent += `</svg>`;
            document.getElementById('canvasContainer').innerHTML = svgContent;
        };

        window.refreshChartsList();
    </script>
</body>
</html>
