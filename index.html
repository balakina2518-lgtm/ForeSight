.sky::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(8,7,19,.74), rgba(8,7,19,.52) 38%, rgba(8,7,19,.62) 62%, rgba(8,7,19,.82));
}
.sky::after{
  content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    radial-gradient(1.6px 1.6px at 10% 20%, #fff 100%, transparent 0),
    radial-gradient(1.2px 1.2px at 80% 10%, #fff 100%, transparent 0),
    radial-gradient(1.8px 1.8px at 60% 65%, #fff 100%, transparent 0),
    radial-gradient(1.1px 1.1px at 30% 80%, #fff 100%, transparent 0),
    radial-gradient(1.4px 1.4px at 92% 75%, #fff 100%, transparent 0),
    radial-gradient(1.3px 1.3px at 45% 35%, #fff 100%, transparent 0),
    radial-gradient(1.7px 1.7px at 15% 55%, #fff 100%, transparent 0),
    radial-gradient(1.2px 1.2px at 70% 90%, #fff 100%, transparent 0),
    radial-gradient(1.5px 1.5px at 25% 5%, #fff 100%, transparent 0),
    radial-gradient(1.1px 1.1px at 88% 45%, #fff 100%, transparent 0);
  background-repeat:repeat;background-size:600px 600px;
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.65}}
@media (prefers-reduced-motion:reduce){ .sky::after{animation:none;opacity:.5} }

.stage{position:relative;z-index:1;max-width:var(--w);margin:0 auto;padding:56px 22px 90px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.screen{animation:rise .5s cubic-bezier(.22,.9,.28,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

/* ── светлая плашка-панель ─────────────────────── */
.panel{
  background:var(--panel);border-radius:22px;padding:34px 30px;
  box-shadow:0 24px 60px rgba(0,0,0,.38);color:var(--ink-text);
}
@media (max-width:480px){ .panel{padding:24px 20px;border-radius:18px} }

/* ── типографика (внутри панели) ───────────────── */
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--wine);font-weight:600}
h1{font-family:'Prata',Georgia,serif;font-weight:400;line-height:1.12;letter-spacing:-.01em;
  font-size:clamp(34px,7.5vw,50px);margin:16px 0 0;color:var(--ink-text)}
h1 em{font-style:normal;color:var(--wine)}
.hair{height:1px;background:linear-gradient(90deg,var(--wine),rgba(156,33,72,0));margin:26px 0}
.lede{color:var(--ink-text-2);font-size:16px;max-width:36em}
.lede b{color:var(--ink-text);font-weight:600}
.greet{font-family:'Prata',serif;color:var(--wine);font-size:15px;margin-bottom:6px}

/* ── поле имени ───────────────────────────────── */
.field{margin-top:30px;max-width:22em}
.field label{display:block;font-size:12px;letter-spacing:.1em;color:var(--ink-text-2);margin-bottom:8px;text-transform:uppercase}
.field input{
  width:100%;background:var(--cream);border:1px solid var(--panel-line);border-radius:10px;
  padding:14px 16px;color:var(--ink-text);font-family:inherit;font-size:16px;font-weight:400;
}
.field input::placeholder{color:var(--ink-text-2);opacity:.6}
.field input:focus{outline:2px solid var(--wine);outline-offset:1px}
.warn{color:#A3273A;font-size:13.5px;margin-top:12px;display:none;font-weight:500}
.warn.show{display:block}

/* ── кнопки ───────────────────────────────────── */
.btn{
  display:inline-block;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--bg-a);
  background:var(--gold);border:0;border-radius:100px;padding:18px 44px;
  cursor:pointer;transition:background .25s ease, transform .12s ease;margin-top:28px;
}
.btn:hover{background:var(--gold-soft)}
.btn:active{transform:scale(.98)}
.btn-ghost{
  background:transparent;color:var(--ink-text-2);border:1px solid var(--panel-line);
  letter-spacing:.12em;padding:14px 28px;font-size:12px;margin-top:22px;
}
.btn-ghost:hover{color:var(--wine);border-color:var(--wine);background:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ── экран блока (заставка планеты) ───────────── */
.blockcard .panel{text-align:center}
.blockglyph{
  width:64px;height:64px;border-radius:50%;margin:0 auto 22px;
  border:1px solid var(--panel-line);display:flex;align-items:center;justify-content:center;
  font-family:'Prata',serif;font-size:28px;color:var(--wine);
  background:radial-gradient(circle at 35% 30%, rgba(156,33,72,.14), transparent 70%);
}
.blocknum{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-text-2);margin-bottom:10px}
.blockname{font-family:'Prata',serif;font-size:clamp(28px,8vw,38px);margin:4px 0 14px;color:var(--ink-text)}
.blockline{color:var(--ink-text-2);max-width:30em;margin:0 auto;font-size:15.5px}

/* ── экран вопроса ─────────────────────────────── */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.qmeta .name{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--wine);font-weight:600}
.qmeta .count{font-size:12px;color:var(--ink-text-2);font-variant-numeric:tabular-nums}
.qtext{font-family:'Prata',Georgia,serif;font-weight:400;font-size:clamp(21px,5.4vw,27px);
  line-height:1.3;margin-bottom:28px;color:var(--ink-text)}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;gap:14px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;
  background:var(--cream);border:2px solid transparent;border-radius:var(--r);
  padding:16px 18px;color:var(--ink-text);font-family:inherit;font-size:15.5px;font-weight:400;
  transition:border-color .2s ease, background .2s ease, transform .12s ease;
}
.opt:hover{border-color:var(--wine);background:var(--cream-2)}
.opt:active{transform:scale(.995)}
.opt.on{border-color:var(--wine);background:var(--cream-2)}
.optletter{font-family:'Prata',serif;color:var(--wine);flex:0 0 auto;font-weight:400}

/* ── результаты ───────────────────────────────── */
.resulthead{font-family:'Prata',serif;font-size:clamp(28px,7vw,38px);margin-bottom:8px;color:var(--wine-deep)}
.resultsub{color:var(--ink-text-2);font-size:14.5px;margin-bottom:32px}
.planetcard{background:var(--cream);border-radius:var(--r);padding:24px 22px;margin-bottom:14px;border-left:4px solid var(--wine)}
.planetcard .ptop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.planetcard .pname{font-family:'Prata',serif;font-size:19px;color:var(--ink-text)}
.planetcard .pscore{font-variant-numeric:tabular-nums;color:var(--wine);font-size:14px;font-weight:600}
.planetcard .ptag{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--wine);margin-bottom:10px;font-weight:600}
.planetcard .ptext{color:var(--ink-text-2);font-size:14.5px}
.bar{height:6px;border-radius:3px;background:rgba(37,26,18,.12);margin:10px 0 2px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold));border-radius:3px;transition:width .8s cubic-bezier(.22,.9,.28,1)}
.startcard{background:var(--cream-2);border-radius:var(--r);padding:22px 20px;border-left:4px solid var(--gold);margin-top:18px}
.startcard h3{font-family:'Prata',serif;font-size:17px;color:var(--wine-deep);margin-bottom:8px}
.startcard p{color:var(--ink-text-2);font-size:14.5px}

@media (max-width:480px){
  .stage{padding:40px 16px 70px}
  .opt{padding:14px 14px}
  .planetcard{padding:20px 18px}
  .zodiac{opacity:.16}
}
</style>
</head>

/* ══════════════════════════════════════════════════════════════════
   ЧТЕНИЯ ПО БАЛЛАМ
   ══════════════════════════════════════════════════════════════════ */
const LEVELS = [
  { min:21, tag:'🟢 Проявлена на максимум', name:'Ресурсное ядро' },
  { min:16, tag:'🔵 Работает устойчиво',    name:'Хорошая база' },
  { min:11, tag:'🟡 Работает с перекосом',  name:'Точка роста' },
  { min:6,  tag:'🟠 Зажата',                name:'Проседание' },
  { min:5,  tag:'🔴 Полный блок',           name:'Теневое состояние' }
];

const GENERIC_5 = 'Функция планеты полностью выключена или загнана в глубокую тень. Ты полностью отказываешься от проявления этой энергии, что напрямую блокирует твой финансовый и экспертный рост.';

const READINGS = {
  sun: {
    21:'Ты — мудрый, душевный, авторитетный наставник. Легко масштабируешься и ведёшь за собой людей.',
    16:'У тебя отличная экспертная позиция, но иногда тебе хочется подстраховаться перед выходом на новый уровень.',
    11:'Твоё желание масштаба сталкивается со страхом оценки и критики (влияние Сатурна/Плутона).',
    6:'У тебя прослеживается страх публичности, обесценивание собственного опыта и побег от ответственности.',
    5:GENERIC_5
  },
  mercury: {
    21:'Ты — интеллектуальный снайпер. У тебя острый ум, убедительная речь, лёгкие продажи и виртуозный контент.',
    16:'У тебя чёткая и грамотная подача информации, но с редкими паузами на редактуру или раздумья.',
    11:'Твои мысли опережают слова, а эмоциональная резкость сменяется уходом в «воду» и расфокус (Марс/Нептун).',
    6:'У тебя зажатая речь, сложности с формулированием смыслов и страх говорить о деньгах.',
    5:GENERIC_5
  },
  venus: {
    21:'Ты — настоящая королева. Твой стиль статусен, визуал дорог, а самоценность монолитна.',
    16:'У тебя хороший, гармоничный вкус, которому иногда не хватает капли львиного эпатажа и смелости.',
    11:'Твоё желание выглядеть шикарно разбивается о страх показаться слишком вызывающей.',
    6:'У тебя идёт непринятие своей красоты, экономия на себе и простой, незаметный гардероб.',
    5:GENERIC_5

/* ══════════════════════════════════════════════════════════════════
   ДВИЖОК
   ══════════════════════════════════════════════════════════════════ */
const state = { screen:'intro', bi:0, qi:0, name:'', answers:{ sun:[], mercury:[], venus:[] } };
const stage = document.getElementById('stage');

function levelOf(score){ return LEVELS.find(l=> score >= l.min); }

function render(){
  if(state.screen==='intro') return renderIntro();
  if(state.screen==='block') return renderBlock();
  if(state.screen==='q')     return renderQuestion();
  if(state.screen==='done')  return renderDone();
}

function renderIntro(){
  stage.innerHTML = `<div class="screen"><div class="panel">
    <div class="eyebrow">Диагностический тест</div>
    <h1>Астро-код<br><em>твоего образа</em></h1>
    <div class="hair"></div>
    <p class="lede">Читай каждый вопрос и выбирай один вариант, <b>А, Б, В, Г или Д</b>, который точнее всего описывает твоё привычное поведение, мысли и ощущение себя. Отвечай так, как есть на самом деле, а не так, как хотелось бы.</p>
    <div class="field">
      <label for="uname">Как тебя зовут?</label>
      <input type="text" id="uname" placeholder="Имя" value="${state.name}">
    </div>
    <p class="warn" id="warn">Впиши имя, чтобы я знала, кому отвечать.</p>
    <button class="btn" id="go">Начать</button>
  </div></div>`;
  document.getElementById('go').onclick = ()=>{
    const val = document.getElementById('uname').value.trim();
    if(!val){ document.getElementById('warn').classList.add('show'); return; }
    state.name = val;
    state.screen='block'; render();
  };
}

function renderBlock(){
  const b = BLOCKS[state.bi];
  stage.innerHTML = `<div class="screen blockcard"><div class="panel">
    <div class="blockglyph">${b.glyph}</div>
    <div class="blocknum">${b.num}</div>
    <div class="blockname">${b.name}</div>
    <p class="blockline">${b.line}</p>
    <button class="btn" id="go">Пять вопросов</button>
  </div></div>`;
  document.getElementById('go').onclick = ()=>{ state.screen='q'; state.qi=0; render(); };
}

function renderQuestion(){
  const b = BLOCKS[state.bi];
  const q = b.questions[state.qi];
  const chosen = state.answers[b.key][state.qi];
  stage.innerHTML = `<div class="screen"><div class="panel">
    <div class="qmeta">
      <span class="name">${b.glyph} ${b.name}</span>
      <span class="count">${state.qi+1} / ${b.questions.length}</span>
    </div>
    <div class="qtext">${q.q}</div>
    <div class="opts">
      ${q.a.map((t,i)=>`<button class="opt${chosen===i?' on':''}" data-i="${i}">
        <span class="optletter">${LETTERS[i]})</span><span>${t}</span></button>`).join('')}
    </div>
    <button class="btn btn-ghost" id="back">Назад</button>
  </div></div>`;
  stage.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.i;
      state.answers[b.key][state.qi] = i;
      stage.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
      el.classList.add('on');
      setTimeout(next, 260);
    };
  });
  document.getElementById('back').onclick = prev;
}

function next(){
  const b = BLOCKS[state.bi];
  if(state.qi < b.questions.length-1){ state.qi++; return render(); }
  if(state.bi < BLOCKS.length-1){ state.bi++; state.screen='block'; return render(); }
  state.screen='done'; render();
}
function prev(){
  if(state.qi > 0){ state.qi--; return render(); }
  if(state.bi > 0){ state.bi--; state.qi = BLOCKS[state.bi].questions.length-1; return render(); }
  state.screen='intro'; render();
}

async function sendToTelegram(text){
  if(!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.startsWith('ВСТАВЬ')) return;
  if(!TELEGRAM_CHAT_ID || TELEGRAM_CHAT_ID.startsWith('ВСТАВЬ')) return;
  try{
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text, parse_mode:'HTML' })
    });
  }catch(e){ /* сеть недоступна, например в превью, экран всё равно покажет результат */ }
}

function renderDone(){
  const scores = {};
  BLOCKS.forEach(b=>{ scores[b.key] = state.answers[b.key].reduce((sum,i)=> sum + (5-i), 0); });

  const weakest = BLOCKS.slice().sort((a,bb)=> scores[a.key]-scores[bb.key])[0];

  stage.innerHTML = `<div class="screen"><div class="panel">
    <div class="eyebrow">Результат</div>
    <div class="resulthead">Твой астро-код, ${state.name}</div>
    <p class="resultsub">Вот как сейчас работают твои три планеты образа.</p>
    <div id="planets"></div>
  </div></div>`;

  const box = stage.querySelector('#planets');
  BLOCKS.forEach(b=>{
    const score = scores[b.key];
    const lvl = levelOf(score);
    const text = READINGS[b.key][lvl.min];
    const pct = Math.round((score/25)*100);
    const card = document.createElement('div');
    card.className = 'planetcard';
    card.innerHTML = `
      <div class="ptop"><span class="pname">${b.glyph} ${b.name}</span><span class="pscore">${score} / 25</span></div>
      <div class="ptag">${lvl.tag} · ${lvl.name}</div>
      <div class="bar"><i style="width:0%"></i></div>
      <p class="ptext">${text}</p>`;
    box.appendChild(card);
    requestAnimationFrame(()=>{ card.querySelector('.bar > i').style.width = pct+'%'; });
  });

  const start = document.createElement('div');
  start.className = 'startcard';
  start.innerHTML = `<h3>С чего начинать</h3>
    <p>Ниже всего у тебя ${weakest.glyph} ${weakest.name}, набрала ${scores[weakest.key]} из 25. Пока эта планета не поднята, работа над остальными двумя даёт меньше, чем могла бы.</p>`;
  box.appendChild(start);

  const lines = BLOCKS.map(b=>{
    const lvl = levelOf(scores[b.key]);
    const letters = state.answers[b.key].map(i=>LETTERS[i]).join(' ');
    return `${b.glyph} ${b.name}: ${scores[b.key]}/25, ${lvl.tag} (${lvl.name})\nОтветы: ${letters}`;
  }).join('\n\n');
  const msg = `🧪 <b>Новый результат «Астро-код образа»</b>\nИмя: ${state.name}\nДата: ${new Date().toLocaleString('ru-RU')}\n\n${lines}`;
  sendToTelegram(msg);
}

render();
</script>
